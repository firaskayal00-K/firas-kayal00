<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop All Furniture — Wren &amp; Oak</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="site-header" id="site-header"></header>

<main class="container">
  <div class="breadcrumbs"><a href="index.html">Home</a><span>/</span><span id="crumb-current">Shop</span></div>

  <div class="section" style="padding-bottom:0;">
    <h1 id="shop-title" style="font-size:30px;">Shop All Furniture</h1>
  </div>

  <div class="shop-layout" style="padding-bottom:64px;">
    <aside class="filters" id="filters"></aside>

    <div>
      <div class="active-filters" id="active-filters"></div>
      <div class="shop-toolbar">
        <span class="result-count" id="result-count"></span>
        <select class="sort-select" id="sort-select">
          <option value="featured">Sort: Featured</option>
          <option value="bestselling">Sort: Best-selling</option>
          <option value="newest">Sort: Newest</option>
          <option value="price-asc">Sort: Price, low to high</option>
          <option value="price-desc">Sort: Price, high to low</option>
          <option value="rating">Sort: Top rated</option>
        </select>
      </div>
      <div class="product-grid" id="product-grid"></div>
      <div class="empty-state" id="empty-state" style="display:none;">
        <h3>No products match your filters</h3>
        <p>Try clearing a filter or searching for something else.</p>
        <button class="btn btn-outline" id="clear-filters-btn">Clear all filters</button>
      </div>
    </div>
  </div>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script type="module" src="js/shop.js"></script>
</body>
</html>
